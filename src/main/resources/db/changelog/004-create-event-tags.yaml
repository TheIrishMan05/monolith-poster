databaseChangeLog:
  - changeSet:
      id: 004-create-event-tags
      author: dev
      changes:
        - createTable:
            tableName: event_tags
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: event_tags
            columnNames: event_id, tag_id
            constraintName: pk_event_tags

        - addForeignKeyConstraint:
            baseTableName: event_tags
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_event_tags_event
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: event_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_event_tags_tag
            onDelete: CASCADE