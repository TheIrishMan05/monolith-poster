databaseChangeLog:
  - changeSet:
      id: 008-create-tickets
      author: dev
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tickets
                    nullable: false

              - column:
                  name: order_item_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: order_item_id
            referencedTableName: order_items
            referencedColumnNames: id
            constraintName: fk_tickets_order_item
            onDelete: SET NULL

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_tickets_event
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: ticket_type_id
            referencedTableName: ticket_types
            referencedColumnNames: id
            constraintName: fk_tickets_ticket_type
            onDelete: RESTRICT

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_order_item_id
            columns:
              - column:
                  name: order_item_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_event_id
            columns:
              - column:
                  name: event_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_ticket_type_id
            columns:
              - column:
                  name: ticket_type_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_status
            columns:
              - column:
                  name: status