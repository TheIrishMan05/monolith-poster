databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: dev
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false