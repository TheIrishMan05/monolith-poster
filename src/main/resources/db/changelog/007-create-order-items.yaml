databaseChangeLog:
  - changeSet:
      id: 007-create-order-items-table
      author: dev
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_items
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_order_items_event
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: ticket_type_id
            referencedTableName: ticket_types
            referencedColumnNames: id
            constraintName: fk_order_items_ticket_type
            onDelete: RESTRICT

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_event_id
            columns:
              - column:
                  name: event_id

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_ticket_type_id
            columns:
              - column:
                  name: ticket_type_id

        - sql:
            sql: |
              ALTER TABLE order_items
              ADD CONSTRAINT ck_order_items_quantity_positive CHECK (quantity > 0);

              ALTER TABLE order_items
              ADD CONSTRAINT ck_order_items_price_positive CHECK (price > 0);